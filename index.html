<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon IA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

      <button id="new-chat" class="new-chat">
        ＋ Recommencer
      </button>

      <div class="history-title">
        HISTORIQUE
      </div>

      <div id="history" class="history"></div>

    </aside>


    <!-- =========================
         PARTIE PRINCIPALE
    ========================== -->

    <div class="main">

      <!-- BARRE DU HAUT -->

      <header class="topbar">

        <div class="top-logo">
          <img src="./logo.png" alt="Logo">
          <span>Mon IA</span>
        </div>

        <div class="status">
          <span class="status-dot"></span>
          En ligne
        </div>

      </header>


      <!-- CHAT -->

      <main class="chat">

        <!-- ÉCRAN D'ACCUEIL -->

        <div class="welcome" id="welcome">

          <img
            class="welcome-logo"
            src="./logo.png"
            alt="Mon IA"
          >

          <h1>Mon IA</h1>

          <p>
            Comment puis-je vous aider ?
          </p>

          <div class="welcome-line"></div>

        </div>


        <!-- MESSAGES -->

        <div id="messages"></div>

      </main>


      <!-- ZONE D'ÉCRITURE -->

      <form id="chat-form" class="input-area">

        <div class="input-box">

          <input
            id="message-input"
            type="text"
            placeholder="Écrivez votre message..."
            autocomplete="off"
            required
          >

          <button
            type="submit"
            class="send-button"
          >
            ➤
          </button>

        </div>

      </form>

    </div>

  </div>


  <script src="./script.js"></script>

</body>

</html>
