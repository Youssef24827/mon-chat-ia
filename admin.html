<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .admin {
      display: flex;
      height: 100vh;
    }

    .users {
      width: 280px;
      background: #202123;
      color: white;
      padding: 20px;
      overflow-y: auto;
    }

    .users h2 {
      margin-top: 0;
    }

    .user {
      padding: 15px;
      background: #343541;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }

    .user:hover {
      background: #444654;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    .message {
  max-width: 70%;
  padding: 12px 16px;
  margin-bottom: 12px;
  border-radius: 16px;
  width: fit-content;
}

.user-message {
  background: #e5e5e5;
  margin-left: auto;
  margin-right: 0;
}

.admin-message {
  background: #d9fdd3;
  margin-left: 0;
  margin-right: auto;
}

    .controls {
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #send {
      background: #10a37f;
      color: white;
    }

    #ai {
      background: #7c3aed;
      color: white;
    }
  </style>
</head>

<body>

<div class="admin">

  <div class="users">
    <h2>💬 Conversations</h2>
    <div id="users"></div>
  </div>

  <div class="chat">

    <div id="messages" class="messages">
      <p>Sélectionne une conversation.</p>
    </div>

    <div class="controls">
      <input
        id="reply"
        type="text"
        placeholder="Écrire une réponse..."
      >

      <button id="ai">
        🤖 Réponse IA
      </button>

      <button id="send">
        Envoyer
      </button>
    </div>

  </div>

</div>

<script>

let conversations = [];
let selectedConversation = null;

async function loadMessages() {

  const response = await fetch("/api/messages");

  if (!response.ok) return;

  conversations = await response.json();

  const users = document.getElementById("users");

  const ids = [
    ...new Set(
      conversations.map(message => message.conversation_id)
    )
  ];

  users.innerHTML = "";

  ids.forEach(id => {

    const div = document.createElement("div");

    div.className = "user";
    div.textContent = "Utilisateur " + id.substring(0, 8);

    div.onclick = () => {
      selectedConversation = id;
      displayConversation();
    };

    users.appendChild(div);
  });

  if (selectedConversation) {
    displayConversation();
  }
}

function displayConversation() {

  const container = document.getElementById("messages");

  container.innerHTML = "";

  const messages = conversations.filter(
    message =>
      message.conversation_id === selectedConversation
  );

  messages.forEach(message => {

    const div = document.createElement("div");

    div.className =
      "message " +
      (message.sender === "user"
        ? "user-message"
        : "admin-message");

    div.textContent = message.message;

    container.appendChild(div);
  });

  container.scrollTop = container.scrollHeight;
}

async function sendReply() {

  const input = document.getElementById("reply");

  const message = input.value.trim();

  if (!message || !selectedConversation) return;

  await fetch("/api/messages", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      conversation_id: selectedConversation,

      sender: "admin",

      message

    })

  });

  input.value = "";

  await loadMessages();
}

async function generateAI() {

  if (!selectedConversation) return;

  const messages = conversations.filter(
    message =>
      message.conversation_id === selectedConversation
  );

  const lastUserMessage =
    [...messages]
      .reverse()
      .find(message => message.sender === "user");

  if (!lastUserMessage) return;

  const response = await fetch("/api/gemini", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      message: lastUserMessage.message,

      history: messages

    })

  });

  const data = await response.json();

  if (data.answer) {
    document.getElementById("reply").value = data.answer;
  }
}

document
  .getElementById("send")
  .addEventListener("click", sendReply);

document
  .getElementById("ai")
  .addEventListener("click", generateAI);

loadMessages();

setInterval(loadMessages, 3000);

</script>

</body>
</html>
