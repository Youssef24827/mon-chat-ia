<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration - Mon IA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f8;
      color: #202123;
    }

    .admin {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 280px;
      background: #202123;
      color: white;
      padding: 20px;
      overflow-y: auto;
    }

    .sidebar h2 {
      margin-bottom: 25px;
    }

    .conversation {
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 8px;
      background: #343541;
    }

    .conversation:hover {
      background: #444654;
    }

    .conversation.active {
      background: #555766;
    }

    .empty {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 65px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      padding: 0 25px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 25px;
    }

    .message-user {
      text-align: left;
    }

    .message-admin {
      text-align: right;
    }

    .bubble {
      display: inline-block;
      padding: 13px 17px;
      border-radius: 15px;
      max-width: 70%;
      text-align: left;
      white-space: pre-wrap;
    }

    .message-user .bubble {
      background: white;
      border: 1px solid #ddd;
    }

    .message-admin .bubble {
      background: #111;
      color: white;
    }

    .empty-messages {
      color: #777;
      text-align: center;
      margin-top: 100px;
    }

    .reply {
      background: white;
      border-top: 1px solid #ddd;
      padding: 15px;
      display: flex;
      gap: 10px;
    }

    .reply textarea {
      flex: 1;
      height: 55px;
      resize: none;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      font-family: inherit;
      outline: none;
    }

    .reply button {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .send {
      background: #111;
      color: white;
    }

    .ai {
      background: #e9e9e9;
      color: #111;
    }

    .reply button:hover {
      opacity: .8;
    }
  </style>
</head>

<body>

<div class="admin">

  <aside class="sidebar">

    <h2>⚙️ Administration</h2>

    <div id="conversations">
      <div class="empty">
        Chargement des conversations...
      </div>
    </div>

  </aside>

  <main class="main">

    <header class="header" id="header">
      Aucune conversation sélectionnée
    </header>

    <section class="messages" id="messages">

      <div class="empty-messages">
        Sélectionne une conversation.
      </div>

    </section>

    <form class="reply" id="reply-form">

      <textarea
        id="reply"
        placeholder="Écrire une réponse..."
        disabled
      ></textarea>

      <button
        type="button"
        class="ai"
        id="ai-button"
        disabled
      >
        🤖 Réponse IA
      </button>

      <button
        type="submit"
        class="send"
        disabled
      >
        Envoyer
      </button>

    </form>

  </main>

</div>

<script>

let selectedConversation = null;
let conversations = {};

const conversationsContainer =
  document.getElementById("conversations");

const messagesContainer =
  document.getElementById("messages");

const header =
  document.getElementById("header");

const reply =
  document.getElementById("reply");

const replyForm =
  document.getElementById("reply-form");

const aiButton =
  document.getElementById("ai-button");

async function loadMessages() {

  try {

    const response = await fetch("/api/admin-messages");

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error);
    }

    conversations = {};

    data.messages.forEach(message => {

      if (!conversations[message.conversation_id]) {
        conversations[message.conversation_id] = [];
      }

      conversations[message.conversation_id].push(message);

    });

    renderConversations();

  } catch (error) {

    console.error(error);

    conversationsContainer.innerHTML =
      `<div class="empty">
        Erreur lors du chargement.
      </div>`;

  }

}

function renderConversations() {

  conversationsContainer.innerHTML = "";

  const ids = Object.keys(conversations);

  if (ids.length === 0) {

    conversationsContainer.innerHTML =
      `<div class="empty">
        Aucun message pour le moment.
      </div>`;

    return;
  }

  ids.forEach(id => {

    const div = document.createElement("div");

    div.className = "conversation";

    div.textContent =
      "👤 " + id.substring(0, 8);

    div.onclick = () => {
      selectConversation(id);
    };

    conversationsContainer.appendChild(div);

  });

}

function selectConversation(id) {

  selectedConversation = id;

  const messages =
    conversations[id] || [];

  header.textContent =
    "Conversation avec " + id.substring(0, 8);

  messagesContainer.innerHTML = "";

  messages.forEach(message => {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      message.sender === "user"
        ? "message message-user"
        : "message message-admin";

    const bubble =
      document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = message.message;

    wrapper.appendChild(bubble);

    messagesContainer.appendChild(wrapper);

  });

  reply.disabled = false;
  aiButton.disabled = false;

  replyForm.querySelector(".send").disabled = false;

  messagesContainer.scrollTop =
    messagesContainer.scrollHeight;

}

aiButton.addEventListener("click", async () => {

  if (!selectedConversation) return;

  const conversation =
    conversations[selectedConversation] || [];

  const lastUserMessage =
    [...conversation]
      .reverse()
      .find(message => message.sender === "user");

  if (!lastUserMessage) return;

  aiButton.disabled = true;
  aiButton.textContent = "⏳ Génération...";

  try {

    const response = await fetch("/api/gemini", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: lastUserMessage.message
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error);
    }

    reply.value = data.answer;

  } catch (error) {

    console.error(error);

    reply.value =
      "Erreur lors de la génération de la réponse.";

  }

  aiButton.disabled = false;
  aiButton.textContent = "🤖 Réponse IA";

});

replyForm.addEventListener("submit", async (event) => {

  event.preventDefault();

  if (!selectedConversation) return;

  const text =
    reply.value.trim();

  if (!text) return;

  try {

    const response =
      await fetch("/api/messages", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          conversationId: selectedConversation,
          sender: "admin",
          message: text
        })

      });

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(data.error);
    }

    reply.value = "";

    await loadMessages();

    selectConversation(selectedConversation);

  } catch (error) {

    console.error(error);

    alert("Impossible d'envoyer la réponse.");

  }

});

loadMessages();

setInterval(loadMessages, 5000);

</script>

</body>
</html>
